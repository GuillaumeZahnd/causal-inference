experiment_name: "world_model_experiments"
run_name: "mlp_baseline"

environment:
  accelerator: "auto"
  torch_matmul_precision: "high"
  mlflow_tracking_uri: "sqlite:///mlflow.db"

data:
  train_seed: 0
  train_days: 90
  test_seed: 100
  test_days: 30
  steps_per_hour: 4
  batch_size: 64

model:
  input_dim: 6
  hidden_dim: 64
  lr: 0.001

training:
  nb_epochs: 15

agent:
  type: "sb3" # Options: "random" or "sb3"

simulation:
  nb_days: 60
  steps_per_hour: 4
  seed: 0

sb3:
  total_timesteps: 20_000
  model_name: "sac_battery_policy"
  model_dir: "trained_agents"
